name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate static site
        shell: bash
        run: |
          test -s docs/index.html
      - name: Stamp exact deployed revision
        shell: bash
        run: node scripts/stamp-pages-revision.mjs docs .pages-site "$GITHUB_SHA"
      - name: Build local documentation entry routes
        shell: bash
        run: node scripts/build-pages-articles.mjs docs .pages-site "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
